templates:
    Holiday:
        file_poster: <<poster>>
        sort_title: 00000a_<<collection_name>>
        collection_order: random
        visible_library: true
        visible_home: true   
        visible_shared: true
        delete_not_scheduled: true
        radarr_add_existing: true
        radarr_add_missing: true
collections:

###########################
#  Holliday Collections   #
###########################

  Ring In The New Year:
    template: {name: Holiday, poster: ./config/posters/paintings/new_year.jpg}
    trakt_list:
      - https://trakt.tv/users/galacticboy/lists/new-years
      - https://trakt.tv/users/galacticboy/lists/nye-sync
      - https://trakt.tv/users/cshinn66/lists/new-years-movies
    summary: Movies that are fun to watch to help bring in the new year.
    schedule: range(11/26-01/02)
    sync_mode: sync


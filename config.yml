libraries:                                      # Library mappings must have a colon (:) placed after them
  # Movies:
  #   metadata_path:
  #     - file: config/Movie.yml
  #     - file: config/Metadata.yml
  #     - file: config/Holiday.yml
  #     - file: config/Special_Genre.yml
  #     - file: config/Director.yml
  #     - file: config/Studio.yml
  #     - file: config/Genre.yml
  #     - file: config/Overlays.yml
  Anime:
    sonarr:
      url: http://localhost:7875/
      token: anime
      add_missing: false
      add_existing: true
      root_folder_path: F:\Anime
      monitor: all
      quality_profile: Anime
      language_profile: English
      series_type: anime
      season_folder: true
      tag:
      search: false
      cutoff_search: false
      sonarr_path:
      plex_path:
    metadata_path:
      - file: config/Anime.yml
  TV Shows:
    metadata_path:
      - file: config/TV_Shows.yml
      - file: config/Overlays.yml
settings:                                       # Can be individually specified per library as well
  cache: true
  cache_expiration: 60
  asset_directory: config/assets
  asset_folders: false
  asset_depth: 1
  create_asset_folders: false
  dimensional_asset_rename: true
  download_url_assets: false
  show_missing_season_assets: false
  sync_mode: append
  minimum_items: 1
  default_collection_order: release
  delete_below_minimum: true
  delete_not_scheduled: false
  run_again_delay: 0
  missing_only_released: false
  only_filter_missing: false
  show_unmanaged: true
  show_filtered: false
  show_options: false
  missing_path: config/missing
  show_missing: true
  show_missing_assets: false
  save_missing: true
  tvdb_language: eng
  ignore_ids:
  ignore_imdb_ids:
  playlist_sync_to_user: all
  verify_ssl: true
webhooks:                                       # Can be individually specified per library as well
  error:
  run_start:
  run_end:
  changes:
plex:                                           # Can be individually specified per library as well; REQUIRED for the script to run

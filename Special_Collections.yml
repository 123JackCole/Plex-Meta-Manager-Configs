templates:
  Special Collection:
    optional:
      - poster
    url_background: https://wallpaperbat.com/img/23094-cinema-hd-wallpaper-top-free-cinema-hd-background.jpg
    url_poster: <<poster>>
    sort_title: 00000b__<<collection_name>>
    collection_order: release.desc
    visible_library: true
    visible_home: true
    visible_shared: true
    sync_mode: sync
collections:

#####################################
#        Special Collections        #
#####################################

  Trending Movies:
    template: {name: Special Collection, poster: https://i.imgur.com/LFJnVzC.jpg}
    collection_order: custom
    trakt_trending: 75
    summary: A collection of movies trending across the internet
    sort_title: 00000b_2
  Latest releases:
    template: {name: Special Collection, poster: https://i.imgur.com/D62EdJd.jpg}
    trakt_list: 
      - https://trakt.tv/users/garycrawfordgc/lists/latest-releases
      - https://trakt.tv/users/giladg/lists/latest-releases
    summary: "Latest releases"
    sort_title: 00000b_3
  Popular Movies:
    template: {name: Special Collection, poster: https://i.imgur.com/WhHiFPX.jpg}
    trakt_watched_weekly: 75
    summary: A collection of the most watched movies over the past week.
    sort_title: 00000b_4
  Best Picture Winners:
    template: {name: Special Collection, poster: https://theposterdb.com/api/assets/40996}
    imdb_list: https://www.imdb.com/search/title/?count=100&groups=oscar_best_picture_winners&sort=year%2Cdesc
    summary: A collection of all Oscar winners.
    sort_title: 00000b_5
    radarr_add_missing: true
  Best Picture Nominees:
    template: {name: Special Collection, poster: https://theposterdb.com/api/assets/40996}
    imdb_list: https://www.imdb.com/search/title/?count=1000&groups=oscar_best_picture_nominees&sort=year%2Cdesc
    summary: A collection of all Oscar nominees.
    sort_title: 00000b_6
    radarr_add_missing: true
  Jack's 2022 Favorites:
    template: {name: Special Collection}
    trakt_list: https://trakt.tv/users/h0tsh0t/lists/jack-s-favorites-of-2022
    summary: Jack's favorite movies of 2022. Ordered by release date. Will update as I go through my watch list.
    sort_title: 00000b_7 
    collection_order: custom
  Jack Recommends:
    template: {name: Special Collection, poster: https://theposterdb.com/api/assets/19138}
    collection_order: random
    trakt_list: https://trakt.tv/users/h0tsh0t/lists/jack-recommends
    summary: A collection of movies that are worth the watch.
    sort_title: 00000b_8
  Stephanie's Asian Flix:
    template: {name: Special Collection, poster: https://theposterdb.com/api/assets/103786}
    visible_library: false
    visible_home: false
    visible_shared: false
    trakt_list:
      - https://trakt.tv/users/despoinap/lists/my-asian-movies-collection
      - https://trakt.tv/users/hypo88/lists/asian-movies
      - https://trakt.tv/users/nocturnalbunny/lists/asian-movies
      - https://trakt.tv/users/matthewssa/lists/asian-movies
      - https://trakt.tv/users/sgtcrapper/lists/asian-movies
    summary: A collection of movies made in Asia or starring Asian Actors.
    sort_title: 00000b_91
  Movies For Paprika (Movies With Dogs):
    template: {name: Special Collection}
    visible_library: false
    visible_home: false
    visible_shared: false
    trakt_list:
      - https://trakt.tv/users/mraniki/lists/theme-dog
      - https://trakt.tv/users/benfranklin/lists/dog-movies
    imdb_list:
      - https://www.imdb.com/list/ls063494147/
    summary: A collection of movies that feature some cute pups.
    sort_title: 00000b_92
    file_poster: .\config\posters\Paprika_Poster.jpg
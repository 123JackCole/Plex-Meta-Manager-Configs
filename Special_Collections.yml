templates:
  Special Collection:
    optional:
      - poster
    url_background: https://wallpaperbat.com/img/23094-cinema-hd-wallpaper-top-free-cinema-hd-background.jpg
    url_poster: <<poster>>
    sort_title: 00000b__<<sort>>
    collection_order: release.desc
    visible_library: true
    visible_home: true
    visible_shared: true
    sync_mode: sync
  Tautulli:
    url_poster: <<poster>>
    sort_title: 00000b__<<sort>>
    collection_order: alpha
    sync_mode: sync
collections:

#####################################
#        Special Collections        #
#####################################

  Seattle Parks Playlist:
    template: {name: Special Collection, poster: https://theposterdb.com/api/assets/195220, sort: 1+}
    summary: A list of movies being shown at Seattle parks in summer 2023. https://parkways.seattle.gov/2023/06/29/2023-center-city-cinema-join-us-for-free-movies-under-the-stars/
    trakt_list:
      - https://trakt.tv/users/h0tsh0t/lists/seattle-summer-outdoor-movies
    collection_order: random

  Trending Movies:
    template: {name: Special Collection, poster: https://theposterdb.com/api/assets/213570, sort: 2+}
    trakt_chart:
      chart: trending
      limit: 75
    summary: A collection of movies trending across the internet
    collection_order: random

  Popular Movies:
    template: {name: Special Collection, poster: https://theposterdb.com/api/assets/213575, sort: 2++}
    trakt_chart:
      chart: popular
      limit: 75
    summary: A collection of the most watched movies over the past week.
    collection_order: random

  Latest releases:
    template: {name: Special Collection, poster: https://theposterdb.com/api/assets/213599, sort: 2+++}
    trakt_list: 
      - https://trakt.tv/users/garycrawfordgc/lists/latest-releases
      - https://trakt.tv/users/giladg/lists/latest-releases
    summary: "A collection of newly-released movies in cinema and on streaming services."

  What's Being Watched on Plex:
    template: {name: Tautulli, poster: https://theposterdb.com/api/assets/213600, sort: 2++++}
    tautulli_watched:
      list_days: 30
      list_size: 10
      list_buffer: 20
      # list_minimum: 0
    summary: A collection of the most watched movies on JCFlix.

  Best Picture Winners:
    template: {name: Special Collection, poster: https://theposterdb.com/api/assets/40996, sort: 3+}
    imdb_list: https://www.imdb.com/search/title/?count=100&groups=oscar_best_picture_winners&sort=year%2Cdesc
    summary: A collection of all Oscar winners.
    radarr_add_missing: true

  Best Picture Nominees:
    template: {name: Special Collection, poster: https://theposterdb.com/api/assets/40996, sort: 3++}
    imdb_list: https://www.imdb.com/search/title/?count=1000&groups=oscar_best_picture_nominees&sort=year%2Cdesc
    summary: A collection of all Oscar nominees.
    radarr_add_missing: true

  Criterion Collection:
    template: {name: Special Collection, sort: 4+}
    trakt_list: 
      - https://trakt.tv/users/twentywashere/lists/the-complete-criterion-collection?sort=rank,asc
    summary: Since 1984, the Criterion Collection has been dedicated to publishing important classic and contemporary films from around the world in editions that offer the highest technical quality and award-winning, original supplements. No matter the medium—from laserdisc to DVD and Blu-ray to streaming—Criterion has maintained its pioneering commitment to presenting each film as its maker would want it seen, in state-of-the-art restorations with special features designed to encourage repeated watching and deepen the viewer’s appreciation of the art of film. Films listed by spine numbers. Release with multiple films not found on Trakt are listed as individual items in this list in case CC did not release them as individual titles as well under a spine number.
    collection_order: custom
    file_poster: .\config\posters\Criterion_Collection.png
    radarr_add_missing: true
    visible_library: false
    visible_home: false
    visible_shared: false

  Criterion Collection (UHD Releases):
    template: {name: Special Collection, sort: 4++}
    trakt_list: 
      - https://trakt.tv/users/tbotcotw/lists/criterion-uhd?sort=rank,asc
    summary: All 4K UHD releases from Criterion, including upcoming releases, sorted by spine number.
    collection_order: custom
    file_poster: .\config\posters\Criterion_Collection.png
    radarr_add_missing: true
    visible_library: false
    visible_home: false
    visible_shared: false

  Jack's 2023 Favorites:
    template: {name: Special Collection, sort: 5+}
    trakt_list: https://trakt.tv/users/h0tsh0t/lists/jack-s-favorites-of-2023
    summary: Jack's favorite movies of 2023. Ordered by release date. Will update as I go through my watch list.
    collection_order: alpha

  Jack's 2022 Favorites:
    template: {name: Special Collection, sort: 5++}
    trakt_list: https://trakt.tv/users/h0tsh0t/lists/jack-s-favorites-of-2022
    summary: Jack's favorite movies of 2022. Ordered by release date. Will update as I go through my watch list.
    collection_order: alpha

  Jack Recommends:
    template: {name: Special Collection, poster: https://theposterdb.com/api/assets/19138, sort: 5+++}
    collection_order: random
    trakt_list: https://trakt.tv/users/h0tsh0t/lists/jack-recommends
    summary: A collection of movies that are worth the watch.

  Feel Good Movies:
    template: {name: Special Collection, sort: 6+}
    trakt_list:
      - https://trakt.tv/users/shana71/lists/feel-good-movies
    imdb_list:
      - https://www.imdb.com/list/ls021615613/
      - https://www.imdb.com/list/ls066599507/
      - https://www.imdb.com/list/ls052580452/
      # - https://www.imdb.com/list/ls057266956/
      - https://www.imdb.com/list/ls025952122/
      - https://www.imdb.com/list/ls050578618/
      - https://www.imdb.com/list/ls058430399/
    summary: A collection of movies that make you feel good.
    file_poster: .\config\posters\Feel_Good_Poster.jpg
    visible_library: false
    visible_home: false
    visible_shared: false

  Asian Invasion:
    template: {name: Special Collection, poster: https://theposterdb.com/api/assets/103786, sort: 6++}
    trakt_list:
      - https://trakt.tv/users/despoinap/lists/my-asian-movies-collection
      - https://trakt.tv/users/hypo88/lists/asian-movies
      - https://trakt.tv/users/nocturnalbunny/lists/asian-movies
      - https://trakt.tv/users/matthewssa/lists/asian-movies
      - https://trakt.tv/users/sgtcrapper/lists/asian-movies
    summary: A collection of movies made in Asia or starring Asian Actors.
    collection_order: random
    visible_library: false
    visible_home: false
    visible_shared: false

  Movies For Paprika (Movies With Dogs):
    template: {name: Special Collection, sort: 6+++}
    trakt_list:
      - https://trakt.tv/users/mraniki/lists/theme-dog
      - https://trakt.tv/users/benfranklin/lists/dog-movies
    imdb_list:
      - https://www.imdb.com/list/ls063494147/
    summary: A collection of movies that feature some cute pups.
    file_poster: .\config\posters\Paprika_Poster.jpg
    visible_library: false
    visible_home: false
    visible_shared: false
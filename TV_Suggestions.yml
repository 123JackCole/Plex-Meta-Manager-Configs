###########################
#        Templates        #
###########################
templates:
    Tautulli:
      url_poster: <<poster>>
      sort_title: +2_<<collection_name>>
      collection_order: alpha
      sync_mode: sync
    Network:
      tmdb_network: <<network>>
      url_poster: <<poster>>
      sort_title: +3_<<collection_name>>
      collection_order: alpha
      sync_mode: sync
        
collections:
####################################
#        Custom Collections        #
####################################       

##################
##     Trakt    ##
##################

  Trending:
    smart_label: title.asc
    sort_title: +1a
    trakt_chart: 
      chart: trending
      limit: 40
      # filtering out anime, crime, donghua, game-show, home-and-garden, news, reality, sporting-event, talk-show 
      genres: action, adventure, animation, biography, children, comedy, documentary, drama, family, fantasy, history, holiday, horror, mini-series, music, musical, mystery, romance, science-fiction, short, soap, special-interest, superhero, suspense, thriller, war, western
    summary: Shows Trending across the internet
    url_poster: https://theposterdb.com/api/assets/480805
    sync_mode: sync
    visible_library: true
    visible_home: true
    visible_shared: true

##################
##     IMDb     ##
##################
  
  Popular TV:
    sort_title: +1b
    imdb_chart: popular_shows
    collection_order: custom
    limit: 40
    summary: A collection of the most watched shows over the past week.
    url_poster: https://theposterdb.com/api/assets/481194
    sync_mode: sync
    visible_library: true
    visible_home: true
    visible_shared: true

  Top Rated TV:
    sort_title: +1c
    imdb_chart: top_shows
    collection_order: custom
    limit: 100
    summary: Top Rated Shows across the internet
    url_poster: https://theposterdb.com/api/assets/481173
    sync_mode: sync
    visible_library: true
    visible_home: true
    visible_shared: true

######################
##     Tautulli     ##
######################

  What's Being Watched on Plex:
    template: {name: Tautulli, poster: https://theposterdb.com/api/assets/481157}
    tautulli_watched:
      list_days: 30
      list_size: 10
      list_buffer: 20
      list_minimum: 1
    summary: A collection of the most watched shows on JCFlix.
    visible_home: true
    visible_library: true
    visible_shared: true


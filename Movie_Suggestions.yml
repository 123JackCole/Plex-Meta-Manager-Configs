templates:
  Special Collection:
    optional:
      - poster
    url_background: https://wallpaperbat.com/img/23094-cinema-hd-wallpaper-top-free-cinema-hd-background.jpg
    url_poster: <<poster>>
    sort_title: 00000b__<<sort>>
    collection_order: release.desc
    visible_library: true
    visible_home: false
    visible_shared: false
    sync_mode: sync
  Tautulli:
    url_poster: <<poster>>
    sort_title: 00000b__<<sort>>
    collection_order: custom
    sync_mode: sync
collections:

#####################################
#        Special Collections        #
#####################################

  Jack's Favorite Horror:
    template: {name: Special Collection, poster: https://theposterdb.com/api/assets/67646, sort: 1+}
    imdb_list:
      - list_id: ls591359533
        limit: 0
        sort_by: title.asc
    summary: Jack's favorite Horror movies for Halloween season.
    collection_order: random
    delete_not_scheduled: true
    schedule: range(09/20-11/30)
    radarr_add_missing: true

  NYT The 100 Best Movies of the 21st Century:
    template: {name: Special Collection, poster: https://theposterdb.com/api/assets/618756, sort: 2+++++}
    tmdb_list:
      - https://www.themoviedb.org/list/8541415-nyt-industry-21st-century-top-100
    summary: "Between streaming services and superhero blockbusters, the way we watch and think about movies has changed dramatically over the past 25 years. But through that period of upheaval, which films have truly stood the test of time?\nTo find out, we embarked on an ambitious new project, polling more than 500 filmmakers, stars and influential film fans to vote for the 10 best movies (however they chose to define that) released since Jan. 1, 2000. In collaboration with The Upshot, we compiled their responses to create a list of the 100 best movies of the 21st century.\nVoters included Oscar-winning directors like Pedro Almodóvar, Sofia Coppola, Barry Jenkins and Guillermo del Toro, as well as acclaimed actors like Chiwetel Ejiofor and Mikey Madison, John Turturro and Julianne Moore. Now you can finally see the full list. Enjoy!"
    collection_order: custom
    radarr_add_missing: true
    visible_home: true
    visible_shared: true

  NYT Readers' 100 Top Movies of the 21st Century:
    template: {name: Special Collection, poster: https://theposterdb.com/api/assets/618756, sort: 2++++++}
    tmdb_list:
      - https://www.themoviedb.org/list/8541416-nyt-reader-21st-century-top-100
    summary: When we talk about the movies we love, every voice deserves a spotlight. So after publishing our official list of the best movies of the 21st century, compiled from the votes of 500-plus filmmakers, actors and other movie-industry professionals, we turned to New York Times readers, who cast more than 200,000 ballots of their own.
    collection_order: custom
    radarr_add_missing: true
    visible_home: true
    visible_shared: true

  r/Criterion’s 100 Best Films of the 21st Century:
    template: {name: Special Collection, sort: 2+++++++}
    file_poster: .\config\posters\Criterion_Collection.png
    tmdb_list:
      - https://www.themoviedb.org/list/8541417-r-criterion-21st-century-top-100
    summary: After the NYTimes published their own list, Zach Domes posted a poll to r/Criterion. With submissions from more than 350 people, here are the top 100 films.
    collection_order: custom
    radarr_add_missing: true
    visible_home: true
    visible_shared: true

  Trending Movies:
    template: {name: Special Collection, poster: https://theposterdb.com/api/assets/480805, sort: 2++}
    trakt_chart:
      chart: trending
      limit: 75
    summary: A collection of movies trending across the internet
    collection_order: random
    visible_home: true
    visible_shared: true

  Popular Movies:
    template: {name: Special Collection, poster: https://theposterdb.com/api/assets/481194, sort: 2+++}

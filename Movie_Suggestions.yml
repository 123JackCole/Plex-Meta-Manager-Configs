  Masters of Cinema:
    template: {name: Special Collection, sort: 4++++++}
    tmdb_list: 
      - https://www.themoviedb.org/list/8540916-the-masters-of-cinema
    summary: "In 2004, Eureka! established The Masters of Cinema Series, a specially curated Blu-ray and DVD collection of classic and world cinema using the finest available materials for home viewing. Films are presented in their original aspect ratio, in meticulous transfers created from recent restorations and / or the most pristine film elements available. The feature presentations are frequently supplemented by short films, documentaries, commentary tracks, deleted scenes, trailers, plus new and vintage footage. Each release also includes an accompanying booklet featuring rare imagery, newly commissioned essays and / or classic writings that take the reader further into the process of the films and the personalities of the filmmakers."
    collection_order: alpha
    radarr_add_missing: true
    visible_library: false

  SIFF (Seattle International Film Festival):
    template: {name: Special Collection, sort: 4+++++}

    template: {name: Special Collection, sort: 6++++}
    trakt_list:
      - https://app.trakt.tv/users/pss-local/lists/hongkong?sort_how=asc
      - https://app.trakt.tv/users/alizaza/lists/hong-kong-essentials?sort_how=desc

      - list_id: ls056259635
      - list_id: ls069516892
      - list_id: ls081633236
      - list_id: ls002185749
    summary: The influence of Hong Kong cinema can be seen far and wide. Bruce Lee remains a global icon, his martial arts movies classics. The groundbreaking action of The Matrix would never have come about if not for John Woo films and the action choreography of Yuen Woo-ping. Quentin Tarantino ripped off Ringo Lam’s City on Fire for his debut, 1992’s Reservoir Dogs. Moonlight owes much to the style of Wong Kar-wai films and the auteur was an influence acknowledged by Sofia Coppola when she collected the Oscar for Best Original Screenplay for Lost in Translation. While Oscar winning film, The Departed is a remake of Infernal Affairs.
    collection_order: random
    visible_library: false


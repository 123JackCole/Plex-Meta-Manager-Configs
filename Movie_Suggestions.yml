      - https://trakt.tv/users/garycrawfordgc/lists/latest-releases
      - https://trakt.tv/users/giladg/lists/latest-releases
    summary: A collection of newly-released movies in cinema and on streaming services.
    visible_home: true
    visible_shared: true

  What's Being Watched on Plex:
    template: {name: Tautulli, poster: https://theposterdb.com/api/assets/481157, sort: 2++++}
    tautulli_watched:
      list_days: 30
      list_size: 10
      list_buffer: 20
      list_minimum: 1
    summary: A collection of the most watched movies on JCFlix.
    visible_home: true
    visible_shared: true

  Best Picture Winners:
    template: {name: Special Collection, poster: https://theposterdb.com/api/assets/40996, sort: 3+}
    trakt_list:
      - https://trakt.tv/users/thefork/lists/academy-awards-best-picture-winners
    summary: "The Academy Award for Best Picture is one of the Academy Awards presented annually by the Academy of Motion Picture Arts and Sciences since the awards debuted in 1929."
    radarr_add_missing: true
    visible_home: range(02/01-03/31)
    visible_shared: range(02/01-03/31)

  Best Picture Nominees:
    template: {name: Special Collection, poster: https://theposterdb.com/api/assets/40996, sort: 3++}

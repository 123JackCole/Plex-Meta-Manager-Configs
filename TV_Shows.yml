###########################
#        Templates        #
###########################
templates:
    Tautulli:
      url_poster: <<poster>>
      sort_title: +2_<<collection_name>>
      collection_order: alpha
      sync_mode: sync
    Set:
      optional:
        - network
        - list
      tmdb_network: <<network>>
      tmdb_list: <<list>>
      sort_title: +4_<<collection_name>>
      sync_mode: sync
      url_poster: <<poster>>
      url_background: <<background>>
    Network:
      tmdb_network: <<network>>
      url_poster: <<poster>>
      sort_title: +3_<<collection_name>>
      collection_order: alpha
      sync_mode: sync
        
collections:
####################################
#        Custom Collections        #
####################################       
  Trending:
    smart_label: title.asc
    sort_title: +1a
    trakt_chart: 
      chart: trending
      limit: 40
      # filtering out anime, crime, donghua, game-show, home-and-garden, news, reality, sporting-event, talk-show 
      genres: action, adventure, animation, biography, children, comedy, documentary, drama, family, fantasy, history, holiday, horror, mini-series, music, musical, mystery, romance, science-fiction, short, soap, special-interest, superhero, suspense, thriller, war, western
    summary: Shows Trending across the internet
    url_poster: https://theposterdb.com/api/assets/213570
    sync_mode: sync
    visible_library: true
    visible_home: true
    visible_shared: true

  Popular TV:
    smart_label: title.asc
    sort_title: +1b
    imdb_list:
      url: https://www.imdb.com/search/title/?title_type=tv_series,tv_miniseries&user_rating=6,desc
      # filtering out crime, reality
      genres: action, adventure, animation, biography, children, comedy, documentary, drama, family, fantasy, food, history, horror, martial arts, mini-series, music, musical, mystery, romance, sci-fi & fantasy, science fiction, short, sport, suspense, thriller, travel, war, war & politics, western
      limit: 40
    summary: A collection of the most watched shows over the past week.
    url_poster: https://theposterdb.com/api/assets/213575
    sync_mode: sync
    visible_library: true
    visible_home: true
    visible_shared: true

  Top Rated TV:
    smart_label: title.asc
    sort_title: +1c
    imdb_list:
      url: https://www.imdb.com/search/title/?title_type=tv_series,tv_miniseries&num_votes=20000,&sort=user_rating,desc
      tmdb_top_rated: 100
      # filtering out crime, reality
      genres: action, adventure, animation, biography, children, comedy, documentary, drama, family, fantasy, food, history, horror, martial arts, mini-series, music, musical, mystery, romance, sci-fi & fantasy, science fiction, short, sport, suspense, thriller, travel, war, war & politics, western
      limit: 100
    summary: Top Rated Shows across the internet
    url_poster: https://theposterdb.com/api/assets/213605
    sync_mode: sync
    visible_library: true
    visible_home: true
    visible_shared: true

  What's Being Watched on Plex:
    template: {name: Tautulli, poster: https://theposterdb.com/api/assets/213600}
    tautulli_watched:
      list_days: 30
      list_size: 10
      list_buffer: 20
    summary: A collection of the most watched shows on JCFlix.


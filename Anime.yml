###########################
##    Anime Templates    ##
###########################
templates:
  Genre:
    optional:
      - poster
    mal_search:
      genre: <<mal_id>>
      limit: 0
    url_poster: <<poster>>
    sort_title: +++_<<collection_name>>
    collection_order: alpha
    collection_mode: hide
    sync_mode: sync
    sonarr_add_existing: true
    sonarr_add_missing: true
  MAL:
    optional:
      - poster
      - sort_title
    sort_title: ++++++_<<sort_title>>
    url_poster: <<poster>>
    mal_userlist:
      username: <<username>>
      status: <<status>>
      sort_by: <<sort>>
      limit: <<limit>>
    collection_order: custom
    visible_home: true
    visible_library: true
    sync_mode: sync
    sonarr_add_existing: true
    sonarr_add_missing: true
  Season:
    optional:
      - poster
    mal_season:
      season: current
      limit: 20
      sort_by: members
    url_poster: <<poster>>
    collection_order: custom
    sort_title: +++++++_<<collection_name>>
    sync_mode: sync
    schedule: range(<<start>>-<<end>>)
    delete_not_scheduled: true
    sonarr_add_existing: true
    sonarr_add_missing: true
  Studio:
    anilist_studio: <<studio_id>>
    sort_title: zzzzzzzzzzzzz<<collection_name>>
    sync_mode: sync
    collection_mode: hide
    sonarr_add_existing: true
    sonarr_add_missing: true

collections:
###########################
#     MAL Collections     #
###########################
  "Jack's Favorite Anime":
    template: { name: MAL, sort_title: Completed, username: JCH0tsh0t, status: completed, sort: score, limit: 40 }
  "Jack's Currently Watching":
    template: { name: MAL, sort_title: Currently_Watching, username: JCH0tsh0t, status: watching, sort: title, limit: 1000 }
  "Jack's Plan to Watch":
    template: { name: MAL, sort_title: Plan_to_Watch, username: JCH0tsh0t, status: plan_to_watch, sort: title, limit: 1000 }
  "Jack's Whole MAL List":
    template: { name: MAL, username: JCH0tsh0t, status: all, sort: title, limit: 1000 }
    sort_title: +_zZzEverything
    collection_mode: hide
    visible_home: false
    visible_library: false

###########################
#    Custom Collection    #
###########################
  Top Airing Anime:
    anilist_search:
      year:
      # sort_by: popular # THIS IS CURRENTLY BUGGED
      format: tv
      status: airing
      limit: 15
    collection_order: custom
    visible_home: true
    visible_library: true
    sort_title: +++++++++_Top_Airing
    sync_mode: sync 
    sonarr_add_existing: true
    sonarr_add_missing: true
  Most Popular Anime:
    mal_popular: 50
    collection_order: custom
    visible_home: true
    visible_library: true
    sort_title: ++++++++_Most_Popular
    sync_mode: sync    
    sonarr_add_existing: true
    sonarr_add_missing: true
  Most Favorited Anime:
    mal_favorite: 50
    collection_order: custom
    visible_home: true
    visible_library: true
    sort_title: ++++++++_Most_Favorited
    sync_mode: sync    
    sonarr_add_existing: true
    sonarr_add_missing: true

###########################
#   Seasons Collections   #
###########################
  Seasonal Winter:
    template: { name: Season, start: 01/01, end: 04/01 }
  Seasonal Spring:
    template: { name: Season, start: 04/01, end: 07/01 }
  Seasonal Summer:
    template: { name: Season, start: 07/01, end: 10/01 }
  Seasonal Fall:
    template: { name: Season, start: 10/01, end: 01/01 }

